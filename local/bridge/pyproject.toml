[project]
name = "carwash-bridge"
version = "0.1.0"
description = "Windows audio bridge between a Bluetooth phone and the backend (local testing only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "sounddevice>=0.5.6",
    "soxr>=1.1.0",
    "websockets>=17.4",
]

[project.scripts]
carwash-bridge = "carwash_bridge.cli:main"

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carwash_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]
