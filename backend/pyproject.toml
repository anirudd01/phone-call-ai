[project]
name = "carwash-voice"
version = "0.1.0"
description = "Phone-call voice agent backend for a car-wash business"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "loguru>=0.7.3,<0.8",
    "phonenumbers>=9.0.44",
    "pipecat-ai[openai,silero,websocket]>=1.16.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
carwash-voice = "carwash_voice.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.28.1",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carwash_voice"]

[tool.pytest.ini_options]
timeout = 30
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: talks to the real OpenAI API (costs money); run with: pytest -m live"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/carwash_voice/db/migrations/versions/*" = ["E501"]
"tests/*" = ["SIM117"]
